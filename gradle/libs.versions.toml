[versions]
# Verified against Maven Central at authoring time.
kotlin = "2.4.20"
ksp = "2.3.12"
junit = "4.13.2"
sqliteJdbc = "3.53.4.0"
kxml2 = "2.3.0"

# NOT verified: Google's Maven (dl.google.com / maven.google.com) is blocked by
# the network policy of the container this was authored in, so these could not
# be resolved. They are the only guessed pins in the project. On the first local
# build, let Gradle tell you: if one fails to resolve, bump it to the current
# stable release (Android Studio's "Upgrade AGP" and the Compose BOM page are
# the quickest sources) and note the version you landed on in docs/DECISIONS.md,
# which spec section 2 asks for.
agp = "8.14.0"
composeBom = "2026.09.00"
coreKtx = "1.17.0"
lifecycle = "2.9.4"
activityCompose = "1.11.0"
room = "2.8.1"
webkit = "1.14.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }

junit = { module = "junit:junit", version.ref = "junit" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
# org.xmlpull.v1 is in the Android framework on device but has no implementation
# in the unit-test android.jar, so EpubParserTest supplies kxml2 instead.
kxml2 = { module = "net.sf.kxml:kxml2", version.ref = "kxml2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
