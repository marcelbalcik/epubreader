[versions]
# A deliberately conservative set, taken verbatim from Google's
# android/architecture-samples (main), where these versions are used together
# and therefore known to resolve and to work with each other. Spec section 2
# asks for "current stable"; Google's Maven is unreachable from the container
# this was authored in, so a proven set beats a guessed one - the first guess
# here was AGP 8.14.0, which does not exist. Bump once it builds for you, and
# note what you land on below.
#
# Now-in-Android's main branch is on AGP 9.3.2 / Kotlin 2.3.0, which is the
# newer pairing if you want it, but AGP 9 changed enough DSL that it is not a
# blind upgrade.
agp = "8.7.3"
kotlin = "2.1.10"
ksp = "2.1.10-1.0.30"
composeBom = "2024.12.01"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
room = "2.6.1"

# Not in that sample, so still a guess: androidx.webkit's development line is
# at 1.18.0-alpha0x, so 1.12.1 is a long-released stable. It is the only
# dependency here whose exact version has not been cross-checked.
webkit = "1.12.1"

junit = "4.13.2"
sqliteJdbc = "3.53.4.0"
kxml2 = "2.3.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }

junit = { module = "junit:junit", version.ref = "junit" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
# org.xmlpull.v1 is in the Android framework on device but has no implementation
# in the unit-test android.jar, so EpubParserTest supplies kxml2 instead.
kxml2 = { module = "net.sf.kxml:kxml2", version.ref = "kxml2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
